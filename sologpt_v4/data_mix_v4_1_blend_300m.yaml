version: 1
description: "SoloLLM v4.1 data proxy: broad-web blend with a bounded reasoning slice"
tokenizer: gpt2
seq_length: 1024
target_tokens: 300000000
shard_tokens: 8388608
split:
  train: 0.98
  val: 0.01
  test: 0.01
filters:
  min_chars: 200
  max_chars: 200000
  min_alpha_ratio: 0.45
  max_repeated_line_fraction: 0.35
  min_language_score: 0.65
streaming:
  shuffle_buffer: 0
  seed: 2041
sources:
  - id: fineweb_edu_sample_10bt
    enabled: true
    weight: 0.30
    dataset: HuggingFaceFW/fineweb-edu
    config: sample-10BT
    split: train
    text_field: text
    notes: "Broad high-quality educational web text from the v3-winning family."
  - id: dclm_baseline
    enabled: true
    weight: 0.20
    dataset: mlfoundations/dclm-baseline-1.0-parquet
    config: null
    split: train
    text_field: text
    notes: "Curated broad web data-quality baseline."
  - id: fineweb_sample_10bt
    enabled: true
    weight: 0.15
    dataset: HuggingFaceFW/fineweb
    config: sample-10BT
    split: train
    text_field: text
    notes: "General web coverage to protect broad held-out perplexity."
  - id: openwebtext
    enabled: true
    weight: 0.07
    dataset: Skylion007/openwebtext
    config: plain_text
    split: train
    text_field: text
    notes: "Legacy project distribution retained at a modest weight."
  - id: cosmopedia_v2
    enabled: true
    weight: 0.10
    dataset: HuggingFaceTB/smollm-corpus
    config: cosmopedia-v2
    split: train
    text_field: text
    notes: "Synthetic educational prose from the v4 reasoning-heavy run, capped to avoid over-specialization."
  - id: finemath_4plus
    enabled: true
    weight: 0.07
    dataset: HuggingFaceTB/finemath
    config: finemath-4plus
    split: train
    text_field: text
    notes: "Math/reasoning signal retained at lower weight than v4."
  - id: smollm_fineweb_edu_dedup
    enabled: true
    weight: 0.03
    dataset: HuggingFaceTB/smollm-corpus
    config: fineweb-edu-dedup
    split: train
    text_field: text
    notes: "Small deduplicated SmolLM educational-web bridge."
  - id: wikipedia_en_20231101
    enabled: true
    weight: 0.08
    dataset: wikimedia/wikipedia
    config: 20231101.en
    split: train
    text_field: text
    notes: "Reference prose for continuity and factual style."
