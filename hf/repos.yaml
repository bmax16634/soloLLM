# Hugging Face publishing manifest for SoloLLM.
# General Ariya convention: [[hugging-face-publishing-workflow]].
# Development happens in /home/bmx/_projects/soloLLM; these repos are publishing targets.

version: 1
project: soloLLM
source_root: /home/bmx/_projects/soloLLM
local_clone_root: /home/bmx/_hf_repos
export_root: outputs/huggingface
fileserver_mirror_root: /mnt/raid/hf_repos

sync_excludes:
  - .git/
  - .cache/
  - __pycache__/
  - "*.pyc"

repos:
  solollm-1.0-152m-base:
    kind: model
    owner: bmax16634
    hf_repo: bmax16634/solollm-1.0-152m-base
    export_dir: outputs/huggingface/solollm-1.0-152m-base
    clone_dir: /home/bmx/_hf_repos/solollm/models/solollm-1.0-152m-base
    fileserver_mirror: /mnt/raid/hf_repos/solollm/models/solollm-1.0-152m-base.git
    lfs: true
    publish_policy: approval_required

  solollm-1.0-123m-base:
    kind: model
    owner: bmax16634
    hf_repo: bmax16634/solollm-1.0-123m-base
    export_dir: outputs/huggingface/solollm-1.0-123m-base
    clone_dir: /home/bmx/_hf_repos/solollm/models/solollm-1.0-123m-base
    fileserver_mirror: /mnt/raid/hf_repos/solollm/models/solollm-1.0-123m-base.git
    lfs: true
    publish_policy: approval_required
